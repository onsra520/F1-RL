name: Main integration checks

on:
  push:
    branches:
      - main
      - integration/all-branches-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -r requirements-runtime.txt -r requirements-test.txt
      - run: git fetch --no-tags origin refs/heads/handoff/physics-v4-khanh-bang-20261106
      - run: python -B -m scripts.wp7_train5_handoff_preflight --root .
      - run: python -B -m pytest -o addopts= tests/local_demo/test_m5_cycle2_admission.py tests/local_demo/test_m5_cycle2_telemetry.py tests/learning/training/test_vector_env.py tests/sandbox/test_independent_suspension_dynamics.py -q -p no:cacheprovider --tb=short
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
