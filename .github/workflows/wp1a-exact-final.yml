name: WP1A Exact Final Head Verification

on:
  push:
    branches:
      - models/ppo-baseline

permissions:
  contents: write

jobs:
  verify-exact-final-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove this temporary verifier and publish final head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wp1a-exact-final.yml
          git commit -m "chore: remove temporary exact-head verifier"
          git push origin HEAD:models/ppo-baseline
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Verify checked out commit is published final head
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse origin/models/ppo-baseline)" = "$FINAL_SHA"
          test ! -e .github/workflows/wp1a-exact-final.yml
          echo "Exact final HEAD: $FINAL_SHA"
      - name: Focused experiment tests
        run: python -m pytest tests/learning/experiments -q
      - name: Learning and orchestration regressions
        run: python -m pytest tests/learning tests/integration/test_training_orchestration_integration.py -q
      - name: Full test suite
        run: python -m pytest -q
      - name: Compile production and scripts
        run: python -m compileall -q f1rl scripts
      - name: Dependency integrity
        run: python -m pip check
      - name: Diff whitespace check
        run: git diff --check b575b37cf69d18bb91d5233ffcbb7cf638535fde...HEAD
      - name: Production dependency boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import re

          sb3_owners = []
          torch_owners = []
          mock_fake_markers = []
          for path in Path("f1rl").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              modules = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      modules.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      modules.append(node.module)
              if any(module == "stable_baselines3" or module.startswith("stable_baselines3.") for module in modules):
                  sb3_owners.append(path.as_posix())
              if any(module == "torch" or module.startswith("torch.") for module in modules):
                  torch_owners.append(path.as_posix())
              if re.search(r"\b(?:Mock|Fake)\b", text):
                  mock_fake_markers.append(path.as_posix())

          expected_sb3 = [
              "f1rl/learning/algorithms/ppo.py",
              "f1rl/learning/training/vector_env.py",
          ]
          assert sorted(sb3_owners) == expected_sb3, sb3_owners
          assert torch_owners == [], torch_owners
          assert mock_fake_markers == [], mock_fake_markers
          print("SB3 owners:", len(sb3_owners), sorted(sb3_owners))
          print("Torch owners:", len(torch_owners))
          print("Production Mock/Fake markers:", len(mock_fake_markers))
          PY
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
