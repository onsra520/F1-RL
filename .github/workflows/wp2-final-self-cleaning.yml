name: WP2 Final Self-Cleaning Verification

on:
  push:
    branches: [models/ppo-baseline]

permissions:
  contents: write

jobs:
  verify-final-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary WP2 workflows and push final HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wp2-focused-temp.yml .github/workflows/wp2-final-self-cleaning.yml
          git commit -m "chore(ci): remove temporary WP2 verification"
          git push origin HEAD:models/ppo-baseline
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
      - name: Install CPU verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Focused WP2 verification
        run: python -m pytest tests/track_assets tests/integration/test_track_asset_corpus.py -q
      - name: Learning and orchestration regressions
        run: python -m pytest tests/learning tests/integration/test_training_orchestration_integration.py -q
      - name: Full test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q f1rl scripts
      - name: Dependency integrity
        run: python -m pip check
      - name: Diff integrity
        run: git diff --check 64334cabfd50dd706b286f86d06c15330368ec30...HEAD
      - name: Final tree and clean status
        run: |
          test ! -e .github/workflows/wp2-focused-temp.yml
          test ! -e .github/workflows/wp2-final-self-cleaning.yml
          test -z "$(git status --short)"
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)"
