name: Main regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU backend
        run: python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install declared development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q f1rl scripts tests
      - name: Full regression
        run: python -m pytest tests -q -ra --durations=15 --junitxml=pytest-results.xml
      - name: Retain regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-results.xml
          if-no-files-found: warn
