name: WP1B temporary focused verification

on:
  push:
    branches:
      - models/ppo-baseline

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . PyYAML pytest
      - name: Run checked-in experiment tests
        run: python -m pytest tests/learning/experiments/test_checked_in_experiment.py -q
