name: H01 contract regression

on:
  pull_request:
    branches: [recovery/wp7-rebuild]
  push:
    branches: [audit/h01-canonical-c2-contract]

permissions:
  contents: read

jobs:
  regression:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Focused H-01 tests
        run: python -m pytest tests/learning/experiments -q
      - name: Full regression
        run: python -m pytest -q
      - name: Compile production and scripts
        run: python -m compileall -q f1rl scripts
      - name: Installed dependency integrity
        run: python -m pip check
