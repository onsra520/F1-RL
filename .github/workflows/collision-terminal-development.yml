name: Development Collision Terminal Regression

on:
  push:
    branches:
      - fix/collision-terminal-runtime
  pull_request:
    branches:
      - fix/auto-drive-lane-render-config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-terminal:
    name: Windows scoped collision terminal and Physics isolation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runtime,dev]"
      - name: Exercise witnessed development collision and existing physics isolation
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m pytest tests/runtime/test_collision_terminal.py tests/runtime/test_auto_drive.py tests/runtime/test_v4_dev_profile.py::test_development_gap_crash_uses_registered_physics_and_race_v4_terminal tests/research/test_wp3_campaign.py -q --tb=short --disable-warnings --junitxml=collision-terminal-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collision-terminal-junit
          path: collision-terminal-junit.xml
          if-no-files-found: ignore
