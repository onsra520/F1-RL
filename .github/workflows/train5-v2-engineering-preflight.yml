name: F1-RL TRAIN-5 v2 Engineering Preflight (No Training)

on:
  push:
    branches:
      - rc/physics-v4-train5-v2-review-*
  pull_request:
    branches:
      - handoff/physics-v4-khanh-bang-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train5-engineering-scope:
    name: Source lock + TRAIN-only Physics v4 scoped regression
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify on-repo draft identity and deny execution routes
        run: python -B scripts/wp7_train5_ci_preflight.py

      - name: Run scoped TRAIN-only Physics/compatibility checks
        run: >-
          python -B -m pytest -q -p no:cacheprovider --tb=short --junitxml=ci-train5.xml
          tests/research/test_wp3_smoke_runtime_profile.py
          tests/research/test_wp3_eval_only_coordinator.py
          tests/integration/test_wp3_registered_crash_terminal_contract.py
          tests/research/test_wp3_owner_train_dev_eval.py
          tests/research/test_wp3_airborne_road_crash_v4.py
          tests/research/test_wp3_wheel_hard_stop_terminal_v4.py
          tests/research/test_wp3_road_crash_prefix_roundoff.py
          tests/research/test_wp3_spatial_partial_wheel_v4.py
          tests/research/test_wp3_roll_envelope_terminal_v4.py
          tests/research/test_wp3_finite_tire_footprint_v4.py
          tests/research/test_wp3_bounded_road_patch_collision.py
          tests/research/test_wp3_crash_race_prefix.py
          tests/research/test_right_turn_train_v2_design.py
          tests/research/test_wp7_dual_turn_v4_feasibility.py
          tests/research/test_wp7_train_only_audit_no_heldout.py

      - name: Upload scoped JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-train5-engineering-scope
          path: ci-train5.xml
          if-no-files-found: warn

# Engineering scope only. Excludes full pytest, external Step3 receipts,
# HELD-OUT, full evaluation, PPO training and six-case PPO smoke.
# Scientific release requires a separate owner-signed seed/source review.
