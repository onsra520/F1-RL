name: WP7 body collision v2 regression

on:
  push:
    branches: [research/wp7-body-collision-v2, research/wp7-road-footprint-v1, research/wp7-ramp-support-v1, research/wp7-owner-acceptance-v1, research/wp7-multisurface-suspension-v1, research/wp7-independent-suspension-dynamics-v1, research/wp7-ballistic-landing-v1, research/wp7-auto-support-release-v1, research/wp7-sloped-clearance-tilted-landing-v1, research/wp7-angular-impulse-landing-v1, research/wp7-contact-manifold-rebound-v1, research/wp7-6dof-sloped-events-v1, research/wp7-torque-free-swept-ccd-v1, research/wp7-ode-enclosure-yaw-tire-v1, research/wp7-physical-validation-readiness-v1]
  pull_request:
    branches: [audit/h01-canonical-c2-contract, research/wp7-body-collision-v2, research/wp7-road-footprint-v1, research/wp7-ramp-support-v1, research/wp7-owner-acceptance-v1, research/wp7-multisurface-suspension-v1]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Geometry and physics tests
        run: python -m pytest tests/sandbox/test_body_collision.py tests/sandbox/test_road_footprint.py tests/sandbox/test_ramp_support.py tests/sandbox/test_multi_surface_support.py tests/sandbox/test_independent_suspension_dynamics.py tests/sandbox/test_ballistic_flight.py tests/sandbox/test_partial_wheel_release.py tests/sandbox/test_sloped_clearance_tilted_landing.py tests/sandbox/test_angular_landing_impulse.py tests/sandbox/test_rotating_impulse_landing.py tests/sandbox/test_contact_manifold.py tests/sandbox/test_manifold_flight.py tests/sandbox/test_torque_free_rotation.py tests/sandbox/test_sloped_multi_event_flight.py tests/sandbox/test_high_clearance_torque_free.py tests/sandbox/test_torque_free_swept_ccd.py tests/sandbox/test_euler_ode_clearance.py tests/sandbox/test_grounded_yaw_dynamics.py tests/sandbox/test_tire_calibration_contract.py tests/sandbox/test_world_grounded_yaw.py tests/research/test_wp7_robustness_gate.py tests/research/test_wp7_reference_benchmarks.py tests/research/test_wp7_calibration_readiness.py tests/learning/training/test_fullbody_training_gate.py tests/learning/test_owner_acceptance_preregistration.py tests/learning/test_robustness_acceptance_v1.py tests/learning/test_corridor_acceptance_v1.py tests/sandbox/test_directed_center_crossing.py tests/learning/test_evidence_backup_manifest.py -q
      - name: Validate preregistered owner decisions
        run: python scripts/wp7_review_owner_acceptance.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q f1rl scripts
      - name: Dependency check
        run: python -m pip check
