[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-rl"
version = "0.1.0"
description = "Interactive reinforcement learning environment for autonomous racing and obstacle avoidance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=2,<3",
]

[project.optional-dependencies]
science = ["cryptography>=50.0.2,<51"]
rl = [
    "stable-baselines3>=2.9,<2.10",
    "PyYAML>=6,<7",
]
runtime = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "stable-baselines3>=2.9,<2.10",
    "PyYAML>=6,<7",
]
dev = [
    "cryptography>=50.0.2,<51",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "stable-baselines3>=2.9,<2.10",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
