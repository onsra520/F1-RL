[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-rl"
version = "0.1.0"
description = "Interactive reinforcement learning environment for autonomous racing and obstacle avoidance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["f1rl*"]